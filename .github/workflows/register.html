<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Smart Learning</title><link rel="stylesheet" href="css/style.css"></head><body data-page="auth"><main class="auth-layout register-layout"><a class="brand auth-brand" href="index.html"><span class="brand-mark">S</span> Smart<span>Learning</span></a><section class="auth-panel"><div class="auth-intro"><span class="eyebrow">Start learning today</span><h1>Create your student account.</h1><p>Your A/L study space is just a few details away.</p></div><form id="registerForm" class="form-card"><h2>Student registration</h2><div class="form-grid"><label>Full name<input id="fullName" required placeholder="Your full name"></label><label>Email address<input id="regEmail" type="email" required placeholder="you@example.com"></label><label>Password<input id="regPassword" type="password" minlength="6" required placeholder="At least 6 characters"></label><label>Confirm password<input id="confirmPassword" type="password" required placeholder="Repeat password"></label><label>Phone number<input id="phone" type="tel" required pattern="[0-9+\\- ]{9,15}" placeholder="07X XXX XXXX"></label><label>School name<input id="school" required placeholder="Your school"></label><label>District<select id="district" required><option value="">Select district</option></select></label><label>A/L stream<select id="stream" required><option value="">Select stream</option><option>Physical Science</option><option>Biological Science</option><option>Commerce</option><option>Arts</option><option>Technology</option></select></label><label>Exam year<select id="examYear" required></select></label></div><p class="form-error" id="registerError" role="alert"></p><button class="btn btn-primary btn-full" type="submit">Create account</button><p class="form-foot">Already registered? <a href="login.html">Log in</a></p></form></section><aside class="auth-art"><div class="auth-art-content"><div class="big-symbol">✦</div><h2>One focused step can change your future.</h2><p>Build better study habits with a learning space made for A/L students.</p></div></aside></main><script src="js/auth.js"></script></body></html>
